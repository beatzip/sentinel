[workspace]
resolver = "3"
members = [
    "crates/sentinel-core",
    "crates/sentinel-common",
    "crates/sentinel-demo",
    "crates/sentinel-events",
    "crates/sentinel-world",
    "crates/sentinel-map",
    "crates/sentinel-visibility",
    "crates/sentinel-features",
    "crates/sentinel-analysis",
    "crates/sentinel-evidence",
    "crates/sentinel-report",
    "crates/sentinel-datasets",
    "crates/sentinel-source2",
    "crates/sentinel-validation",
    "crates/sentinel-memory",
    "crates/sentinel-model",
    "crates/sentinel-cli",
    "crates/sentinel-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/user/sentinel-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
sequoia-boost = "0.2"
sha2 = "0.10"
