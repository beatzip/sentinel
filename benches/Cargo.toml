[package]
name = "sentinel-benches"
version = "0.1.0"
edition = "2021"
publish = false

[[bench]]
name = "analysis"
harness = false

[dependencies]
sentinel-core = { path = "../sentinel-core" }
sentinel-features = { path = "../sentinel-features" }
sentinel-analysis = { path = "../sentinel-analysis" }
sentinel-visibility = { path = "../sentinel-visibility" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
