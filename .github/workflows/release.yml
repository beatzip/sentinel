name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sentinel-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sentinel-macos-amd64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: sentinel-windows-amd64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sentinel-macos-arm64

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/sentinel${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }} \
             ${{ matrix.artifact }}${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sentinel-linux-amd64
            sentinel-macos-amd64
            sentinel-macos-arm64
            sentinel-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
